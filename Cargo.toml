[package]
name = "cpuguard"
version = "0.1.0"
edition = "2024"

[lib]
name = "cpuguard"

[[bin]]
name = "cpuguard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
